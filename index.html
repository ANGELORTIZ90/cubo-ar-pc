<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cubo AR — Componentes de PC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    .aviso {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(0,0,0,.65); color: #fff; font-family: sans-serif;
      font-size: 14px; text-align: center; padding: 6px;
    }
  </style>
  <script>
    // Escala cualquier GLB para que quepa sobre el marcador y lo centra
    AFRAME.registerComponent('ajustar', {
      schema: { tam: { default: 1.2 } },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const malla = this.el.getObject3D('mesh');
          if (!malla) return;
          const caja = new THREE.Box3().setFromObject(malla);
          const dims = caja.getSize(new THREE.Vector3());
          const mayor = Math.max(dims.x, dims.y, dims.z);
          const s = this.data.tam / mayor;
          this.el.object3D.scale.setScalar(s);
          const centro = caja.getCenter(new THREE.Vector3());
          this.el.object3D.position.set(
            -centro.x * s,
            -caja.min.y * s + 0.05,
            -centro.z * s
          );
        });
      }
    });
  </script>
</head>
<body style="margin:0; overflow:hidden">
  <div class="aviso">Cubo AR — Componentes de PC · Apunte la cámara a una cara del cubo</div>

  <a-scene embedded
           arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true; colorManagement: true;"
           vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="m-placa"     src="modelos/placa_base.glb"></a-asset-item>
      <a-asset-item id="m-cpu"       src="modelos/cpu.glb"></a-asset-item>
      <a-asset-item id="m-disipador" src="modelos/disipador.glb"></a-asset-item>
      <a-asset-item id="m-ram"       src="modelos/ram.glb"></a-asset-item>
      <a-asset-item id="m-gpu"       src="modelos/gpu.glb"></a-asset-item>
      <a-asset-item id="m-fuente"    src="modelos/fuente.glb"></a-asset-item>
      <a-asset-item id="m-caja"      src="modelos/caja.glb"></a-asset-item>
      <a-asset-item id="m-almacen"   src="modelos/almacenamiento.glb"></a-asset-item>
      <a-asset-item id="m-nvme"      src="modelos/nvme.glb"></a-asset-item>
      <a-asset-item id="m-ventilador" src="modelos/ventilador.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

    <a-marker type="barcode" value="0">
      <a-entity gltf-model="#m-placa" ajustar></a-entity>
      <a-text value="Placa base" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="1">
      <a-entity gltf-model="#m-cpu" ajustar></a-entity>
      <a-text value="Procesador (CPU)" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="2">
      <a-entity gltf-model="#m-disipador" ajustar></a-entity>
      <a-text value="Disipador de CPU" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="3">
      <a-entity gltf-model="#m-ram" ajustar></a-entity>
      <a-text value="Memoria RAM" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="4">
      <a-entity gltf-model="#m-gpu" ajustar></a-entity>
      <a-text value="Tarjeta grafica (GPU)" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="5">
      <a-entity gltf-model="#m-fuente" ajustar></a-entity>
      <a-text value="Fuente (PSU)" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="6">
      <a-entity gltf-model="#m-caja" ajustar></a-entity>
      <a-text value="Caja / Torre" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="7">
      <a-entity gltf-model="#m-almacen" ajustar></a-entity>
      <a-text value="Almacenamiento (SSD / HDD)" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="8">
      <a-entity gltf-model="#m-nvme" ajustar></a-entity>
      <a-text value="SSD NVMe (M.2)" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <a-marker type="barcode" value="9">
      <a-entity gltf-model="#m-ventilador" ajustar></a-entity>
      <a-text value="Ventilador de caja" position="0 1.5 0" align="center" color="#FFF" width="4"></a-text>
    </a-marker>

    <!-- Cubo 3: arquitectura clasica (puente norte / puente sur) -->
    <a-marker type="barcode" value="10">
      <a-entity rotation="-90 0 0" position="0 0.1 0" scale="0.85 0.85 0.85">
        <a-text value="ARQUITECTURA CLASICA" position="0 1.35 0.05" align="center" color="#FFD700" width="5"></a-text>

        <a-box position="0 1.0 0.05" depth="0.1" height="0.35" width="0.9" color="#e74c3c">
          <a-text value="CPU" position="0 0 0.07" align="center" color="#FFF" width="4"></a-text>
        </a-box>
        <a-box position="0 0.72 0.05" depth="0.02" height="0.22" width="0.06" color="#bdc3c7"></a-box>
        <a-text value="FSB" position="0.22 0.72 0.05" align="left" color="#FFF" width="2.2"></a-text>

        <a-box position="0 0.45 0.05" depth="0.1" height="0.35" width="1.1" color="#3498db">
          <a-text value="PUENTE NORTE" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="-0.82 0.45 0.05" depth="0.02" height="0.06" width="0.55" color="#bdc3c7"></a-box>
        <a-box position="-1.35 0.45 0.05" depth="0.1" height="0.3" width="0.55" color="#2ecc71">
          <a-text value="RAM" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="0.82 0.45 0.05" depth="0.02" height="0.06" width="0.55" color="#bdc3c7"></a-box>
        <a-box position="1.35 0.45 0.05" depth="0.1" height="0.3" width="0.55" color="#9b59b6">
          <a-text value="GPU PCIe" position="0 0 0.07" align="center" color="#FFF" width="2.6"></a-text>
        </a-box>

        <a-box position="0 0.08 0.05" depth="0.02" height="0.28" width="0.06" color="#bdc3c7"></a-box>

        <a-box position="0 -0.3 0.05" depth="0.1" height="0.35" width="1.1" color="#e67e22">
          <a-text value="PUENTE SUR" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="-0.82 -0.3 0.05" depth="0.02" height="0.06" width="0.55" color="#bdc3c7"></a-box>
        <a-box position="-1.35 -0.3 0.05" depth="0.1" height="0.3" width="0.55" color="#1abc9c">
          <a-text value="SATA" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="0.82 -0.3 0.05" depth="0.02" height="0.06" width="0.55" color="#bdc3c7"></a-box>
        <a-box position="1.35 -0.3 0.05" depth="0.1" height="0.3" width="0.55" color="#34495e">
          <a-text value="LAN" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="0 -0.67 0.05" depth="0.02" height="0.28" width="0.06" color="#bdc3c7"></a-box>
        <a-box position="0 -0.95 0.05" depth="0.1" height="0.3" width="0.55" color="#7f8c8d">
          <a-text value="USB" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>

        <a-sphere radius="0.05" color="#FFD700" position="0 0.95 0.14"
          animation="property: position; from: 0 0.95 0.14; to: 0 0.5 0.14; dur: 900; loop: true; dir: alternate; easing: linear"></a-sphere>
        <a-sphere radius="0.05" color="#2ecc71" position="-0.6 0.45 0.14"
          animation="property: position; from: -0.6 0.45 0.14; to: -1.1 0.45 0.14; dur: 1100; loop: true; dir: alternate; easing: linear; delay: 300"></a-sphere>
        <a-sphere radius="0.05" color="#9b59b6" position="0.6 0.45 0.14"
          animation="property: position; from: 0.6 0.45 0.14; to: 1.1 0.45 0.14; dur: 1000; loop: true; dir: alternate; easing: linear; delay: 600"></a-sphere>
        <a-sphere radius="0.05" color="#e67e22" position="0 0.4 0.14"
          animation="property: position; from: 0 0.4 0.14; to: 0 -0.25 0.14; dur: 1300; loop: true; dir: alternate; easing: linear; delay: 150"></a-sphere>
        <a-sphere radius="0.05" color="#ecf0f1" position="0 -0.4 0.14"
          animation="property: position; from: 0 -0.4 0.14; to: 0 -0.9 0.14; dur: 1200; loop: true; dir: alternate; easing: linear; delay: 450"></a-sphere>
      </a-entity>
    </a-marker>

    <!-- Cubo 3: SoC moderno (CPU + GPU + NPU integrados) -->
    <a-marker type="barcode" value="11">
      <a-entity rotation="-90 0 0" position="0 0.1 0" scale="0.85 0.85 0.85">
        <a-text value="SOC MODERNO" position="0 1.35 0.05" align="center" color="#FFD700" width="5"></a-text>

        <a-box position="0 0.4 0" depth="0.06" height="1.7" width="2.5" color="#2c3e50"></a-box>

        <a-box position="-0.62 0.85 0.08" depth="0.1" height="0.55" width="1.05" color="#e74c3c"
               animation="property: scale; to: 1.12 1.12 1.12; dur: 700; loop: true; dir: alternate">
          <a-text value="NUCLEOS CPU" position="0 0 0.07" align="center" color="#FFF" width="2.6"></a-text>
        </a-box>
        <a-box position="0.62 0.85 0.08" depth="0.1" height="0.55" width="1.05" color="#9b59b6"
               animation="property: scale; to: 1.12 1.12 1.12; dur: 700; loop: true; dir: alternate; delay: 350">
          <a-text value="GPU" position="0 0 0.07" align="center" color="#FFF" width="3.2"></a-text>
        </a-box>
        <a-box position="-0.62 0.15 0.08" depth="0.1" height="0.55" width="1.05" color="#16a085"
               animation="property: scale; to: 1.12 1.12 1.12; dur: 700; loop: true; dir: alternate; delay: 700">
          <a-text value="NPU (IA)" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="0.62 0.15 0.08" depth="0.1" height="0.55" width="1.05" color="#e67e22"
               animation="property: scale; to: 1.12 1.12 1.12; dur: 700; loop: true; dir: alternate; delay: 1050">
          <a-text value="CTRL RAM+PCIe" position="0 0.08 0.07" align="center" color="#FFF" width="2.2"></a-text>
          <a-text value="(ex puente norte)" position="0 -0.12 0.07" align="center" color="#FFF" width="1.8"></a-text>
        </a-box>

        <a-box position="-1.6 0.4 0.02" depth="0.02" height="0.06" width="0.7" color="#bdc3c7"></a-box>
        <a-box position="-2.1 0.4 0.05" depth="0.1" height="0.4" width="0.6" color="#2ecc71">
          <a-text value="RAM" position="0 0 0.07" align="center" color="#FFF" width="3"></a-text>
        </a-box>
        <a-box position="1.6 0.4 0.02" depth="0.02" height="0.06" width="0.7" color="#bdc3c7"></a-box>
        <a-box position="2.1 0.4 0.05" depth="0.1" height="0.4" width="0.6" color="#3498db">
          <a-text value="USB SSD" position="0 0 0.07" align="center" color="#FFF" width="2.2"></a-text>
        </a-box>

        <a-sphere radius="0.05" color="#2ecc71" position="-1.9 0.4 0.14"
          animation="property: position; from: -1.9 0.4 0.14; to: -1.3 0.4 0.14; dur: 900; loop: true; dir: alternate; easing: linear"></a-sphere>
        <a-sphere radius="0.05" color="#3498db" position="1.3 0.4 0.14"
          animation="property: position; from: 1.3 0.4 0.14; to: 1.9 0.4 0.14; dur: 900; loop: true; dir: alternate; easing: linear; delay: 450"></a-sphere>

        <a-text value="Todo el puente norte vive dentro del chip" position="0 -0.75 0.05" align="center" color="#FFF" width="3.6"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
